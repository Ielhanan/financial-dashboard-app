services:
  - type: web
    name: financial-dashboard-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FINANCIAL_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
